name: CI/CD 部署流水線

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/sample-api

jobs:
  # ──────────────────────────────────────────
  # Job 1：建構 & 單元測試
  # ──────────────────────────────────────────
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 原始碼
        uses: actions/checkout@v4

      - name: 設定 .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore 相依套件
        run: dotnet restore

      - name: 建構方案
        run: dotnet build --no-restore -c Release

      - name: 執行單元測試
        run: >
          dotnet test SampleProject.NUnitTest/SampleProject.NUnitTest.csproj
          --no-build
          -c Release
          --logger "trx;LogFileName=test-results.trx"
          --collect:"XPlat Code Coverage"

      - name: 上傳測試報告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/TestResults/**"
          retention-days: 7

  # ──────────────────────────────────────────
  # Job 2：建構 Docker Image & 推送至 GHCR
  # ──────────────────────────────────────────
  docker-build-push:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: build-and-test
    # 僅在推送至 main 分支時才執行（PR 不推送 Image）
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      image_digest: ${{ steps.push.outputs.digest }}

    steps:
      - name: Checkout 原始碼
        uses: actions/checkout@v4

      - name: 登入 GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 產生 Docker Metadata（tags / labels）
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: 設定 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 建構並推送 Docker Image
        id: push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ──────────────────────────────────────────
  # Job 3：透過 SSH 部署至遠端伺服器
  # ──────────────────────────────────────────
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: docker-build-push
    environment: production

    steps:
      - name: Checkout 原始碼（取得 docker-compose.yml）
        uses: actions/checkout@v4

      - name: 複製 docker-compose.yml 至遠端伺服器
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          source: "docker-compose.yml"
          target: "~/sample-project"

      - name: SSH 遠端執行部署指令
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            cd ~/sample-project

            # 登入 GHCR
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
              -u ${{ github.actor }} --password-stdin

            # 拉取最新 web Image
            IMAGE_TAG=ghcr.io/${{ env.IMAGE_NAME }}:latest \
              docker compose pull web

            # 啟動所有服務（mssql、mq、web），已在執行中的服務不會重建
            IMAGE_TAG=ghcr.io/${{ env.IMAGE_NAME }}:latest \
              docker compose up -d --no-build mssql mq web

            # 清理舊的懸空 Image
            docker image prune -f
